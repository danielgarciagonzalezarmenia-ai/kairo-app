name: kairo
description: "App de eventos deportivos en vivo con diseño premium estilo iOS."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.9
  flutter_localizations:
    sdk: flutter
  http: 1.6.0
  video_player: 2.11.1
  shared_preferences: 2.5.6
  intl: any
  flutter_local_notifications: 22.3.2
  timezone: 0.11.2
  url_launcher: 6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: 0.14.4

flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  ios: true
  remove_alpha_ios: true
  android: true
  adaptive_icon_background: "#0A84FF"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 24

flutter:
  uses-material-design: true

  assets:
    - assets/icon/
    - assets/images/
